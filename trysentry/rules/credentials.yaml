- title: LSASS memory access
  description: A process opened lsass.exe with memory read access — credential dumping.
  level: critical
  mitre: T1003.001
  signals:
    - lsass_access
    - credential_dump
  detection:
    TargetImage|endswith: lsass.exe
    GrantedAccess|contains:
      - "0x1010"
      - "0x1410"
      - "0x1438"
      - "0x143a"
    condition: selection

- title: Suspicious tool accessing LSASS
  description: Known credential-dumping tool accessing LSASS.
  level: critical
  mitre: T1003.001
  signals:
    - lsass_access
    - known_tool
  detection:
    TargetImage|endswith: lsass.exe
    SourceImage|endswith:
      - mimikatz.exe
      - procdump.exe
      - pwdump.exe
      - lazagne.exe
    condition: selection

- title: Browser credential file access
  description: A non-browser process accessing Chrome or Edge credential stores.
  level: high
  mitre: T1555.003
  signals:
    - browser_creds
    - credential_dump
  detection:
    TargetFilename|contains:
      - "\\Login Data"
      - "\\Web Data"
      - "\\Cookies"
    SourceImage|endswith:
      - powershell.exe
      - cmd.exe
      - rundll32.exe
    condition: selection

- title: SAM file access
  description: A process accessed the SAM registry hive — credential extraction.
  level: critical
  mitre: T1003.002
  signals:
    - credential_dump
  detection:
    TargetObject|contains: "SAM\\Domains\\Account"
    condition: selection
